services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: opentap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opentap}
      POSTGRES_DB: opentap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentap"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://opentap:${POSTGRES_PASSWORD:-opentap}@postgres:5432/opentap?sslmode=disable
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      API_PORT: "8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-EVENTS}
      NATS_MAX_BYTES: ${NATS_MAX_BYTES:-1073741824}
      REDIS_API_KEY_TTL: ${REDIS_API_KEY_TTL:-5m}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-100}
      API_RATE_WINDOW: ${API_RATE_WINDOW:-60s}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://opentap:${POSTGRES_PASSWORD:-opentap}@postgres:5432/opentap?sslmode=disable
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-EVENTS}
      NATS_MAX_BYTES: ${NATS_MAX_BYTES:-1073741824}
      REDIS_SEGMENT_CACHE_TTL: ${REDIS_SEGMENT_CACHE_TTL:-10m}
      SEGMENT_INTERVAL: ${SEGMENT_INTERVAL:-5m}
      SCHEMA_FLUSH_INTERVAL: ${SCHEMA_FLUSH_INTERVAL:-30s}
      DLQ_MAX_RETRIES: ${DLQ_MAX_RETRIES:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  natsdata:
  caddy_data:
  caddy_config:
